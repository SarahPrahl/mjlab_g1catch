[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project]
name = "unitree-g1-catch"
version = "0.1.0"
description = "Reactive ball-conditioned motion imitation for the Unitree G1 with Inspire hands."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "mjlab==1.6.0",
  "numpy>=2.0",
  "scipy>=1.15",
]

[project.scripts]
g1-catch = "unitree_g1_catch.motions.pipeline:main"
g1-catch-train = "unitree_g1_catch.cli:train_main"
g1-catch-play = "unitree_g1_catch.cli:play_main"

[project.optional-dependencies]
cpu = ["torch>=2.7.0"]
cu128 = ["torch>=2.7.0"]

[dependency-groups]
dev = [
  "ruff>=0.16.1",
  "ty>=0.0.14",
]

[tool.uv]
conflicts = [
  [{extra = "cu128"}, {extra = "cpu"}],
]
constraint-dependencies = [
  "GitPython>=3.1.57",
  "lxml>=6.1.0",
]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = [
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
]

[tool.ruff]
src = ["src"]
indent-width = 2
line-length = 88
exclude = ["third_party", "typings"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]

[tool.ty.environment]
python = ".venv"
extra-paths = ["typings"]

[tool.ty.src]
include = ["src"]
exclude = ["third_party"]
